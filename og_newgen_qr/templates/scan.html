<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Scan Attendance QR</title>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>


    <style>

        * {
            box-sizing: border-box;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;
        }

        body {

            background: #000;

            color: #fff;

            margin: 0;

            padding: 20px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            min-height: 100vh;

            text-align: center;
        }

        #reader {

            width: 100%;

            max-width: 360px;

            border-radius: 12px;

            overflow: hidden;

            background: #111;
        }

        .success-screen {

            display: none;

            flex-direction: column;

            align-items: center;

            animation:
                fadeIn
                0.3s
                ease-out;
        }

        .checkmark {

            width: 90px;

            height: 90px;

            border-radius: 50%;

            background: #22c55e;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 3rem;

            margin-bottom: 20px;

            box-shadow:
                0 0 25px #22c55e;
        }

        .usn-badge {

            background: #1e293b;

            border: 1px solid #334155;

            padding: 10px 24px;

            border-radius: 20px;

            font-size: 1.3rem;

            color: #38bdf8;

            font-weight: bold;

            margin-top: 10px;
        }

        @keyframes fadeIn {

            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

    </style>

</head>


<body>


<div id="scannerView">

    <h3 style="margin-bottom:5px;">
        Scan ID Card QR
    </h3>


    <p
        style="
            color:#888;
            font-size:0.85rem;
            margin-bottom:15px;
        "
    >
        Hold your college ID card QR
        in front of camera
    </p>


    <div id="reader"></div>

</div>


<div
    id="successScreen"
    class="success-screen"
>

    <div class="checkmark">
        ✓
    </div>


    <h2>
        Attendance Recorded!
    </h2>


    <div
        class="usn-badge"
        id="recordedUSN"
    >
        ---
    </div>


    <p
        style="
            color:#aaa;
            font-size:0.85rem;
            margin-top:25px;
        "
    >
        Attendance already recorded
        for this USN on this device.<br>
        No further attempts permitted.
    </p>

</div>


<!--
    Flask puts the current attendance
    session information here.
-->

<div
    id="sessionData"
    data-session-id="{{ session_id }}"
    data-expired="{{
        'true'
        if is_expired
        else 'false'
    }}"
    style="display:none;"
></div>


<script>

    // ========================================================
    // SESSION INFORMATION
    // ========================================================

    const sessionEl =
        document.getElementById(
            'sessionData'
        );


    const sessionId =
        sessionEl.dataset.sessionId;


    const isExpired =
        sessionEl.dataset.expired === 'true';


    // Each attendance session gets
    // its own localStorage key.

    const storageKey =
        `scanned_session_${sessionId}`;


    const existingScan =
        localStorage.getItem(
            storageKey
        );


    // ========================================================
    // CHECK EXISTING SCAN / EXPIRY
    // ========================================================

    if (existingScan || isExpired) {

        showSuccessScreen(
            existingScan ||
            'LINK EXPIRED'
        );

    } else {

        startScanner();
    }


    // ========================================================
    // SUCCESS SCREEN
    // ========================================================

    function showSuccessScreen(usn) {

        document.getElementById(
            'scannerView'
        ).style.display =
            'none';


        document.getElementById(
            'successScreen'
        ).style.display =
            'flex';


        document.getElementById(
            'recordedUSN'
        ).innerText =
            usn;
    }


    // ========================================================
    // START CAMERA
    // ========================================================

    function startScanner() {

        const html5QrCode =
            new Html5Qrcode(
                "reader"
            );


        html5QrCode.start(

            {
                facingMode:
                    "environment"
            },

            {
                fps: 20,

                qrbox: {
                    width: 250,
                    height: 250
                }
            },


            // QR SUCCESS
            (decodedText) => {

                html5QrCode
                    .stop()
                    .then(() => {

                        processScan(
                            decodedText
                        );

                    });
            },


            // QR SCANNING ERRORS
            () => {}

        ).catch(() => {

            alert(
                "Camera permission denied. " +
                "Enable camera access to scan."
            );
        });
    }


    // ========================================================
    // SEND SCAN TO FLASK
    // ========================================================

    async function processScan(scannedData) {

        try {

            let res =
                await fetch(
                    '/api/submit-scan',
                    {
                        method: 'POST',

                        headers: {
                            'Content-Type':
                                'application/json'
                        },

                        body: JSON.stringify({

                            session_id:
                                sessionId,

                            usn:
                                scannedData
                        })
                    }
                );


            let data =
                await res.json();


            if (data.status === 'success') {

                // Remember successful scan
                // on this device.

                localStorage.setItem(
                    storageKey,
                    data.usn
                );


                showSuccessScreen(
                    data.usn
                );

            } else {

                alert(
                    data.message ||
                    'Scan failed'
                );


                location.reload();
            }

        } catch (error) {

            console.error(error);

            alert(
                'Unable to connect to server.'
            );

            location.reload();
        }
    }

</script>


</body>

</html>
